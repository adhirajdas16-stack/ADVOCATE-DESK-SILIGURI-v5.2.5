plugins { id 'com.android.application' }

android {
    namespace 'in.advocatedesk.siliguri'
    compileSdk 35

    defaultConfig {
        applicationId 'in.advocatedesk.siliguri'
        minSdk 23
        targetSdk 35
        versionCode 11
        versionName '5.2.5'
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    // Supplies the AndroidX SQLite API referenced during compilation.
    implementation 'androidx.sqlite:sqlite:2.4.0'
    implementation 'net.zetetic:android-database-sqlcipher:4.5.4'
}
